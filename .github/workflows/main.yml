
name: Build FawaNews Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android ZIP
        run: |
          test -f FawaNewsAndroid.zip
          unzip -o FawaNewsAndroid.zip -d android-source
          find android-source -type f -name settings.gradle.kts

      - name: Locate Android project
        id: locate
        run: |
          SETTINGS=$(find android-source -type f -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts was not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts was not found"
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FawaNews-Android-APK
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
